<!--
  Isi file ini untuk alogin.html (atau login.html, tergantung login-by yang aktif)
  di direktori "newlogin" MikroTik R1. Fungsinya cuma redirect ke landing page
  eksternal sambil membawa variabel MikroTik (chap-id, chap-challenge, dst).

  PENTING: chap-id dan chap-challenge ditaruh di atribut HTML (value="..."),
  BUKAN langsung di dalam kode JavaScript — karena isinya data biner mentah
  yang bisa berisi karakter kutip/backslash dan merusak sintaks JS kalau
  ditempel langsung sebagai string literal.
-->
<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>

<input type="hidden" id="f-chapid" value="$(chap-id)">
<input type="hidden" id="f-chapchallenge" value="$(chap-challenge)">
<input type="hidden" id="f-linkloginonly" value="$(link-login-only)">
<input type="hidden" id="f-linkorig" value="$(link-orig)">
<input type="hidden" id="f-mac" value="$(mac)">
<input type="hidden" id="f-ip" value="$(ip)">

<script type="text/javascript">
  var params = new URLSearchParams();
  params.set('router', 'r1_krs');
  params.set('mac', document.getElementById('f-mac').value);
  params.set('ip', document.getElementById('f-ip').value);
  params.set('link-login-only', document.getElementById('f-linkloginonly').value);
  params.set('link-orig', document.getElementById('f-linkorig').value);

  var chapId = document.getElementById('f-chapid').value;
  var chapChallenge = document.getElementById('f-chapchallenge').value;
  if (chapId) {
    params.set('chap-id', chapId);
    params.set('chap-challenge', chapChallenge);
  }

  window.location.href = 'https://spiderspot.amertaasamedia.co.id/landing?' + params.toString();
</script>
<noscript>
  JavaScript harus diaktifkan untuk melanjutkan.
</noscript>
</body>
</html>
